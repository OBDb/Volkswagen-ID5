    description: "The Volkswagen ID.5 is a battery electric compact coupe SUV produced by Volkswagen since January 2022. Built on the same MEB (Modular Electric Drive Matrix) platform as the ID.4, the ID.5 features a distinctive sloping roofline that gives it a more aerodynamic profile with a drag coefficient of 0.26 (0.02 lower than the ID.4). The model was previewed in August 2021 and officially revealed in November 2021. Available in three variants: Pro, Pro Performance (both rear-wheel drive), and GTX (dual-motor all-wheel drive). Unlike the ID.4 which offers multiple battery options, the ID.5 is exclusively offered with a 77 kWh usable (82 kWh gross) battery pack. Charging capability includes DC fast charging at up to 135 kW, enabling a 10-80% charge in approximately 28 minutes. The interior mirrors the ID.4's minimalist design with a 10-inch infotainment screen as standard and an optional 12-inch display. Despite the coupe roofline, rear headroom is only slightly reduced compared to the ID.4, while cargo capacity measures 549 liters with rear seats up and 1,561 liters with seats folded. For the 2024 model year, the ID.5 received updates including a larger 12.9-inch infotainment display with improved software and the upgraded APP 550 electric motor for enhanced power and efficiency."